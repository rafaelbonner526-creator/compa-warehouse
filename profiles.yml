compa_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/warehouse.duckdb
      schema: silver
    prod:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: silver
      location: US
      threads: 4
      priority: interactive
