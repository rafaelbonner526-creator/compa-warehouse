name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPA_LEADS_DIR: tests/fixtures/leads
      MONARCH_LANDING_DIR: tests/fixtures/monarch
      FRED_LANDING_DIR: tests/fixtures/fred
      LONGHISTORY_LANDING_DIR: tests/fixtures/longhistory
      STRIPE_LANDING_DIR: tests/fixtures/stripe
      PLM_OPS_LANDING_DIR: tests/fixtures/plm_ops
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Create warehouse directory
        run: mkdir -p data
      - name: Load leads bronze from fixtures (dlt)
        run: uv run ingestion/load_bronze_dlt.py
      - name: Load finance bronze from fixtures (dlt)
        run: uv run ingestion/load_finance.py
      - name: Load macro bronze from fixtures (dlt)
        run: uv run ingestion/load_macro.py
      - name: Load long-history bronze from fixtures (dlt)
        run: uv run ingestion/load_longhistory.py
      - name: Load Stripe bronze from fixtures (dlt)
        run: uv run ingestion/load_stripe.py
      - name: Load PLM ops bronze from fixtures (dlt)
        run: uv run ingestion/load_plm_ops.py
      - name: Mart coverage (every mart reaches a surface, or says why not)
        run: python3 scripts/lint_mart_coverage.py
      - name: dbt build (models + snapshot + tests)
        run: uv run dbt build --profiles-dir .
