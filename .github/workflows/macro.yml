name: macro refresh

on:
  schedule:
    - cron: "0 11 * * *"   # ~6-7am ET daily
  workflow_dispatch:

jobs:
  macro:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_TARGET: bigquery
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      GCP_PROJECT: compa-warehouse
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Write service-account key
        run: printf '%s' '${{ secrets.GCP_SA_KEY }}' > sa.json
      - name: Extract FRED
        run: uv run ingestion/extract_fred.py
      - name: Load macro to BigQuery
        run: uv run ingestion/load_macro.py
      - name: dbt build macro models
        run: uv run dbt build --target prod --profiles-dir . --select stg_fred mart_macro_indicators mart_macro_regime
