version: 2

models:
  # A null ticker silently fails the join to seeds/security_map, so the holding
  # quietly falls back to default region / asset_class / sleeve instead of its
  # mapped ones, and vanishes from any ticker-based display. XOM sat in exactly
  # that state until the All Weather asset list made it visible. This test makes
  # the failure loud instead of silent.
  - name: stg_holdings
    columns:
      - name: ticker
        tests:
          - not_null

  # Four boxes, always, regardless of holdings.
  - name: mart_all_weather
    columns:
      - name: box
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - rising_growth_falling_inflation
                  - rising_growth_rising_inflation
                  - falling_growth_falling_inflation
                  - falling_growth_rising_inflation

  - name: mart_debasement_signals
    columns:
      - name: criterion_order
        tests:
          - unique
          - not_null

  - name: mart_big_cycle_comparative
    description: >
      Where 18 economies sit on Dalio's long-term debt cycle, all scored on the same
      bands as of their own latest year. JST ends 2020, so this is a 2020 snapshot and
      NOT comparable to mart_big_cycle, which reads live FRED data for the US only.
    columns:
      - name: country_code
        description: ISO3 code, as the IMF Historical Public Debt Database uses.
        tests: [not_null, unique]
      - name: country
        description: Readable name for the ten powers the framework is about; ISO3 otherwise.
        tests: [not_null]
      - name: years_on_record
        description: >
          How many annual observations exist for this country. Ranges from 225 (UK,
          from 1800) to 35 (China, from 1984), so a percentile of own history is not
          comparable across rows without reading this.
        tests: [not_null]
      - name: as_of_year
        description: Year the debt figure is from. Emitted so nobody reads it as current.
        tests: [not_null]
      - name: debt_to_gdp
        description: Public debt as a PERCENT of GDP, already scaled at source.
        tests: [not_null]
      - name: stage_name
        tests:
          - not_null
          - accepted_values:
              values: ['New world order', 'Peace and prosperity', 'Debt bubble',
                       'Top of cycle', 'Decline', 'New world order (next)']
      - name: trajectory
        tests:
          - accepted_values:
              values: ['rising fast', 'rising', 'flat', 'falling', 'falling fast', 'unknown']

  - name: int_big_cycle_stages
    description: >
      The six Dalio stage bands, defined once. Both mart_big_cycle and
      mart_big_cycle_comparative read them from here so the thresholds cannot drift.
    columns:
      - name: stage_order
        tests: [not_null, unique]
      - name: stage_name
        tests: [not_null, unique]

  - name: mart_world_power
    description: >
      Share of world GDP for eleven powers at Maddison benchmark years, 1820-2022.
      The relative-power side of the Dalio framing: debt says how indebted a country
      is, this says who is ascending and who is being overtaken. Denominator is
      Maddison's own published world total, never a sum of reporting countries.
    columns:
      - name: country
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: pct_of_world_gdp
        description: Percent of world output that year. UK peaks ~9% in 1870, US ~27% in 1950.
        tests: [not_null]
      - name: pct_of_own_peak
        description: Where the country sits today relative to its own maximum share.
