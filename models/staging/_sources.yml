version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: leads_master
      - name: touch_log
      # finance domain (Monarch)
      - name: mm_accounts
      - name: mm_transactions
      - name: mm_categories
      - name: mm_recurring
      - name: mm_networth
      - name: mm_holdings
      # macro (FRED)
      - name: fred_observations
      # long history (Shiller 1871+, JST 1870+ x18 countries, BoE 1209+)
      - name: lh_shiller
      - name: lh_jst
      - name: lh_boe
      - name: lh_maddison
      # PLM operational telemetry. Catalog aggregates and RAG eval metrics only:
      # no patient data reaches this warehouse by construction. See
      # ingestion/extract_plm_ops.py for why row-level export is excluded.
      - name: plm_db_health
      - name: plm_retrieval_runs
      - name: plm_llm_cost
      - name: lh_imf_debt
      # Stripe (Ampwell revenue)
      - name: stripe_charges
      - name: stripe_invoices
      - name: stripe_subscriptions
      - name: stripe_customers
      # dlt's own load log, used by mart_data_freshness to report when each
      # pipeline last ran (distinct from how recent the data itself is)
      - name: _dlt_loads
